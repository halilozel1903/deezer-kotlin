<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="deezer-kotlin: Kotlin client for the public Deezer API with an Android Auto music browser" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A0F0D"/>
      <stop offset="1" stop-color="#7E2B24"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#120403" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="1190" cy="30" r="220" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="30" cy="560" r="170" fill="#FFB4A8" opacity="0.08"/>
  <!-- Equalizer bars -->
  <g fill="#FFB4A8" opacity="0.18">
    <rect x="80" y="96" width="10" height="28" rx="5"/>
    <rect x="96" y="84" width="10" height="40" rx="5"/>
    <rect x="112" y="102" width="10" height="22" rx="5"/>
    <rect x="128" y="90" width="10" height="34" rx="5"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="170" fill="#FFB4A8" font-size="22" font-weight="700" letter-spacing="3">KOTLIN · ANDROID AUTO</text>
    <text x="80" y="238" fill="#FFFFFF" font-size="58" font-weight="800">deezer-kotlin</text>
    <text x="80" y="290" fill="#FFDAD5" font-size="25">Kotlin client for the public Deezer API:</text>
    <text x="80" y="324" fill="#FFDAD5" font-size="25">charts, search, artists, albums, playlists</text>
    <text x="80" y="358" fill="#FFDAD5" font-size="25">and 30-second previews in the car.</text>
    <g font-size="16" font-weight="600">
      <rect x="80" y="400" width="104" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="132" y="425" fill="#FFFFFF" text-anchor="middle">Ktor</text>
      <rect x="196" y="400" width="104" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="248" y="425" fill="#FFFFFF" text-anchor="middle">Media3</text>
      <rect x="312" y="400" width="140" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="382" y="425" fill="#FFFFFF" text-anchor="middle">Android Auto</text>
      <rect x="464" y="400" width="104" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="516" y="425" fill="#FFFFFF" text-anchor="middle">Paging</text>
    </g>
    <text x="80" y="492" fill="#FFDAD5" font-size="14" opacity="0.7">Unofficial client. Deezer is a trademark of Deezer SA.</text>
  </g>
  <!-- Code card -->
  <g filter="url(#shadow)">
    <rect x="720" y="92" width="488" height="376" rx="22" fill="#1A1110"/>
  </g>
  <circle cx="752" cy="122" r="7" fill="#FF6B5E"/>
  <circle cx="776" cy="122" r="7" fill="#FFC44D"/>
  <circle cx="800" cy="122" r="7" fill="#5FD068"/>
  <text x="1180" y="127" fill="#A08C89" font-family="Inter, Roboto, Arial, sans-serif" font-size="14" text-anchor="end">Charts.kt</text>
  <g font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="17">
    <text x="752" y="176"><tspan fill="#E7A1FF">val</tspan><tspan fill="#F1DFDC"> deezer = </tspan><tspan fill="#FFDB8A">DeezerClient</tspan><tspan fill="#F1DFDC">()</tspan></text>
    <text x="752" y="220"><tspan fill="#E7A1FF">val</tspan><tspan fill="#F1DFDC"> chart = deezer.</tspan><tspan fill="#8CC8FF">chart</tspan><tspan fill="#F1DFDC">()</tspan></text>
    <text x="752" y="248"><tspan fill="#F1DFDC">chart.tracks.data.</tspan><tspan fill="#8CC8FF">forEach</tspan><tspan fill="#F1DFDC"> {</tspan></text>
    <text x="786" y="276"><tspan fill="#8CC8FF">println</tspan><tspan fill="#F1DFDC">(it.title + </tspan><tspan fill="#A6E3A1">" · "</tspan><tspan fill="#F1DFDC"> + it.durationText)</tspan></text>
    <text x="752" y="304"><tspan fill="#F1DFDC">}</tspan></text>
    <text x="752" y="348"><tspan fill="#E7A1FF">val</tspan><tspan fill="#F1DFDC"> q = </tspan><tspan fill="#FFDB8A">DeezerQuery</tspan><tspan fill="#F1DFDC">(</tspan><tspan fill="#A6E3A1">"night drive"</tspan><tspan fill="#F1DFDC">,</tspan></text>
    <text x="786" y="376"><tspan fill="#F1DFDC">durationMax = </tspan><tspan fill="#FFB4A8">240</tspan><tspan fill="#F1DFDC">)</tspan></text>
    <text x="752" y="404"><tspan fill="#F1DFDC">deezer.</tspan><tspan fill="#8CC8FF">searchTracks</tspan><tspan fill="#F1DFDC">(q, </tspan><tspan fill="#FFDB8A">SearchOrder</tspan><tspan fill="#F1DFDC">.RatingDesc)</tspan></text>
    <text x="752" y="440" fill="#A08C89">// q=night drive dur_max:240</text>
  </g>
</svg>

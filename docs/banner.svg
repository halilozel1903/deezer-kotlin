<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="deezer-kotlin: Kotlin client for the public Deezer API with an Android Auto music browser" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A0F0D"/>
      <stop offset="1" stop-color="#7E2B24"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#120403" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="1190" cy="30" r="220" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="30" cy="560" r="170" fill="#FFB4A8" opacity="0.08"/>
  <!-- Equalizer bars -->
  <g fill="#FFB4A8" opacity="0.18">
    <rect x="80" y="96" width="10" height="28" rx="5"/>
    <rect x="96" y="84" width="10" height="40" rx="5"/>
    <rect x="112" y="102" width="10" height="22" rx="5"/>
    <rect x="128" y="90" width="10" height="34" rx="5"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="170" fill="#FFB4A8" font-size="22" font-weight="700" letter-spacing="3">KOTLIN · ANDROID AUTO</text>
    <text x="80" y="238" fill="#FFFFFF" font-size="58" font-weight="800">deezer-kotlin</text>
    <text x="80" y="290" fill="#FFDAD5" font-size="25">Kotlin client for the public Deezer API:</text>
    <text x="80" y="324" fill="#FFDAD5" font-size="25">charts, search, artists, albums, playlists</text>
    <text x="80" y="358" fill="#FFDAD5" font-size="25">and 30-second previews in the car.</text>
    <g font-size="16" font-weight="600">
      <rect x="80" y="400" width="104" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="132" y="425" fill="#FFFFFF" text-anchor="middle">Ktor</text>
      <rect x="196" y="400" width="104" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="248" y="425" fill="#FFFFFF" text-anchor="middle">Media3</text>
      <rect x="312" y="400" width="140" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="382" y="425" fill="#FFFFFF" text-anchor="middle">Android Auto</text>
      <rect x="464" y="400" width="104" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="516" y="425" fill="#FFFFFF" text-anchor="middle">Paging</text>
    </g>
    <text x="80" y="492" fill="#FFDAD5" font-size="14" opacity="0.7">Unofficial client. Deezer is a trademark of Deezer SA.</text>
  </g>
  <!-- Abstract car display: a browse rail of cover tiles and a now-playing bar -->
  <defs>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A65"/><stop offset="1" stop-color="#C2185B"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C4DFF"/><stop offset="1" stop-color="#311B92"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26C6DA"/><stop offset="1" stop-color="#00695C"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD54F"/><stop offset="1" stop-color="#EF6C00"/></linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3A1A17"/><stop offset="0.7" stop-color="#1A0907"/><stop offset="1" stop-color="#0E0403"/></radialGradient>
  </defs>
  <circle cx="1090" cy="300" r="190" fill="url(#disc)" opacity="0.9"/>
  <g fill="none" stroke="#FFFFFF" opacity="0.06">
    <circle cx="1090" cy="300" r="160"/><circle cx="1090" cy="300" r="130"/><circle cx="1090" cy="300" r="100"/>
  </g>
  <circle cx="1090" cy="300" r="46" fill="#B3261E"/>
  <circle cx="1090" cy="300" r="7" fill="#2A0F0D"/>
  <g filter="url(#shadow)">
    <rect x="660" y="140" width="420" height="300" rx="28" fill="#140605"/>
    <!-- side rail -->
    <rect x="660" y="140" width="76" height="300" rx="28" fill="#1F0B09"/>
    <g fill="#FFB4A8">
      <rect x="684" y="180" width="6" height="18" rx="3"/><rect x="694" y="172" width="6" height="26" rx="3"/><rect x="704" y="184" width="6" height="14" rx="3"/>
    </g>
    <g fill="#FFFFFF" opacity="0.35">
      <circle cx="698" cy="246" r="9"/>
      <rect x="688" y="286" width="9" height="9" rx="2"/><rect x="700" y="286" width="9" height="9" rx="2"/><rect x="688" y="298" width="9" height="9" rx="2"/><rect x="700" y="298" width="9" height="9" rx="2"/>
      <circle cx="698" cy="346" r="5"/>
    </g>
    <!-- cover tiles -->
    <rect x="760" y="172" width="92" height="92" rx="14" fill="url(#t1)"/>
    <rect x="866" y="172" width="92" height="92" rx="14" fill="url(#t2)"/>
    <rect x="972" y="172" width="92" height="92" rx="14" fill="url(#t3)"/>
    <g fill="#FFFFFF" opacity="0.22">
      <rect x="760" y="276" width="70" height="8" rx="4"/><rect x="866" y="276" width="56" height="8" rx="4"/><rect x="972" y="276" width="76" height="8" rx="4"/>
    </g>
    <!-- now playing bar -->
    <rect x="760" y="318" width="304" height="96" rx="18" fill="#2A100D"/>
    <rect x="776" y="334" width="64" height="64" rx="12" fill="url(#t4)"/>
    <rect x="856" y="346" width="120" height="9" rx="4.5" fill="#FFFFFF" opacity="0.55"/>
    <rect x="856" y="364" width="84" height="8" rx="4" fill="#FFFFFF" opacity="0.25"/>
    <rect x="856" y="386" width="190" height="4" rx="2" fill="#FFFFFF" opacity="0.15"/>
    <rect x="856" y="386" width="96" height="4" rx="2" fill="#FF6E5A"/>
    <circle cx="1028" cy="358" r="20" fill="#FF6E5A"/>
    <path d="M1022 347 L1022 369 L1039 358 Z" fill="#2A0F0D"/>
  </g>
</svg>
